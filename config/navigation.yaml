grid:
  columns: 20
  rows: 20
  width: 7.0
  height: 7.0
  origin_x: 0.0
  origin_y: 0.0

frame:
  # Raw odometry is reset to (0, 0) at the centre of grid cell (0, 0).
  arena_x_from_odom: -y
  arena_y_from_odom: +x
  odom_zero_arena_x: 0.175
  odom_zero_arena_y: 0.175

active_inference:
  # The transmitter/source belief uses a 10 by 10 grid (0.7 m cells).
  goal_resolution: 10
  temporal_horizon: 1
  message_passing_iterations: 5
  policy_samples: 200
  exact_state_limit: 100
  random_seed: 0
  policy_workers: 1
  normalized_signal_preference: false

experiment:
  start_column: 0
  start_row: 0

termination:
  provider: persistent_rssi
  rssi_threshold: -62.0
  consecutive_observations: 3

topics:
  odom: /tb4_08/odom
  rssi: /tb4_08/rssi
  cmd_vel: /tb4_08/cmd_vel

sensors:
  rssi_median_window: 5
  odom_timeout: 1.0
  rssi_timeout: 1.0

motion:
  linear_speed: 0.15
  angular_speed: 0.3
  position_tolerance: 0.02
  yaw_tolerance: 0.03
  control_period: 0.05
  action_timeout: 30.0
  # Restore a repeatable antenna orientation before the next RSSI observation.
  final_heading: positive_y
  settling_time: 2.5

rssi_likelihood:
  reference_rssi: -63.02
  path_loss_exponent: 1.635
  signal_sigma: 3.37
  minimum_calibrated_distance: 1.0
  minimum_rssi: -95.0
  maximum_rssi: -55.0

likelihood_provider: calibrated_dbm
